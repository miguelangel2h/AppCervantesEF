<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEIP Cervantes - Educación Física</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{--bg:#EDF1F7;--card:#fff;--ink:#14213D;--mute:#5B6B82;--line:#D3DBE8;--brand:#1D4E89;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1724;--card:#17233A;--ink:#E8EEF8;--mute:#93A3BC;--line:#2A3A57;--brand:#6EA8FF;--onbrand:#0F1724}}
:root[data-theme="dark"]{--bg:#0F1724;--card:#17233A;--ink:#E8EEF8;--mute:#93A3BC;--line:#2A3A57;--brand:#6EA8FF;--onbrand:#0F1724}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.mute{color:var(--mute)}
.inp{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;font:inherit}
.inp:focus,.btn:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.55rem .9rem;font:inherit;font-weight:700;cursor:pointer}
.btn-p{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.btn-d{color:#C62828;border-color:#C62828}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tab{padding:.6rem 1rem;border-radius:10px;font-weight:700;cursor:pointer;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700}
.tab[aria-selected=true]{background:var(--brand);color:var(--onbrand)}
.sn{min-width:84px;padding:.7rem 1rem;border-radius:12px;font:inherit;font-weight:700;font-size:1.05rem;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .12s}
.sn:active{transform:scale(.95)}
.sn.yes.on{background:#16E05A;border-color:#0B9A3B;color:#05290F;animation:spark 1s ease-in-out infinite}
.sn.no.on{background:#E5252A;border-color:#8E1014;color:#fff;box-shadow:0 0 0 3px rgba(229,37,42,.35)}
@keyframes spark{0%,100%{box-shadow:0 0 6px 2px rgba(22,224,90,.55)}50%{box-shadow:0 0 22px 8px rgba(22,224,90,.95)}}
@media (prefers-reduced-motion:reduce){.sn.yes.on{animation:none;box-shadow:0 0 14px 4px rgba(22,224,90,.8)}}
table{border-collapse:collapse}th,td{border:1px solid var(--line);padding:.35rem .5rem;text-align:center;font-size:.85rem}
th.f,td.f{position:sticky;left:0;background:var(--card);text-align:left;min-width:150px;max-width:190px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const KEY='cervantes_ef_v1';
const INS={
 cotejo:{n:'Lista de cotejo (SÍ / NO)',t:'bin'},
 escala:{n:'Escala de observación (Nunca → Siempre)',t:'lvl',L:['Nunca','A veces','Casi siempre','Siempre']},
 rubrica:{n:'Rúbrica (Inicial → Destacado)',t:'lvl',L:['Inicial','En proceso','Logrado','Destacado']},
 pruebas:{n:'Pruebas de condición física (medidas)',t:'num'}
};
const COL=['#E5252A','#F59E0B','#84CC16','#16E05A'];
const DEF={
 cotejo:['Asistencia y puntualidad','Trae ropa y calzado deportivo','Realiza el calentamiento correctamente','Participa activamente en la sesión','Respeta las normas y el material','Colabora con sus compañeros/as','Hábitos de higiene tras la sesión'],
 escala:['Esfuerzo y actitud','Juego limpio y respeto a las reglas','Trabajo en equipo','Autonomía en la tarea','Control emocional ante ganar o perder'],
 rubrica:['Habilidades motrices básicas (carrera, salto, lanzamiento)','Manejo de móviles (balón, aro, pelota)','Coordinación y equilibrio','Expresión corporal y ritmo','Orientación espacio-temporal'],
 pruebas:[['Course-navette','palieres'],['Salto de longitud a pies juntos','cm'],['Flexión de tronco sentado','cm'],['Velocidad 30 m','s'],['Lanzamiento de balón medicinal','m'],['Abdominales en 30 s','rep']]
};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fresh=()=>({groups:[],students:[],ind:Object.fromEntries(Object.entries(DEF).map(([k,a])=>[k,a.map(x=>Array.isArray(x)?{id:uid(),text:x[0],unit:x[1]}:{id:uid(),text:x})])),records:{},logo:''});
const load=()=>{try{const s=localStorage.getItem(KEY);return s?{...fresh(),...JSON.parse(s)}:fresh()}catch(e){return fresh()}};
const vtxt=(k,v)=>INS[k].t==='bin'?(v?'SÍ':'NO'):INS[k].t==='lvl'?INS[k].L[v]:String(v).replace('.',',');
const rec=(d,sid,k,a,b)=>Object.entries(d.records).map(([key,r])=>[...key.split('|'),r]).filter(([s,dt,i])=>s===sid&&(!k||i===k)&&(!a||dt>=a)&&(!b||dt<=b)).sort((x,y)=>x[1]<y[1]?-1:1);
const fmt=d=>d.split('-').reverse().join('/');
const saveFile=async(name,text,mime)=>{
  try{const dl=window.claude&&await window.claude.use('downloads');
    if(dl){await dl.save({filename:name,data:text});return 'ok'}}
  catch(e){if(e&&e.code==='declined')return 'declined'}
  try{const url=URL.createObjectURL(new Blob([text],{type:mime}));const l=document.createElement('a');l.href=url;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return 'ok'}catch(e){return 'error'}
};

function Logo({src,onFile}){
  const ref=useRef();
  const pick=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>onFile(r.result);r.readAsDataURL(f)};
  return <button className="shrink-0" title="Cambiar logo (clic)" aria-label="Cambiar logo del colegio" onClick={()=>ref.current.click()} style={{background:'none',border:0,cursor:'pointer'}}>
    <input ref={ref} type="file" accept="image/*" hidden onChange={pick}/>
    {src?<img src={src} alt="Logo del colegio" style={{height:64,maxWidth:120,objectFit:'contain'}}/>:
    <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Logo CEIP Cervantes">
      <path d="M32 3 57 12v18c0 14-10 25-25 31C17 55 7 44 7 30V12z" fill="#1D4E89"/>
      <path d="M32 24c-5-4-12-4-17-2v20c5-2 12-2 17 2 5-4 12-4 17-2V22c-5-2-12-2-17 2z" fill="#F4C430"/>
      <path d="M32 24v20" stroke="#1D4E89" strokeWidth="2"/>
      <text x="32" y="58" textAnchor="middle" fontSize="7" fontWeight="700" fill="#fff">CERVANTES</text>
    </svg>}
  </button>;
}

const InsSel=({ik,setIk})=><label className="block"><span className="mute text-sm">Instrumento</span><select className="inp" value={ik} onChange={e=>setIk(e.target.value)}>{Object.entries(INS).map(([k,v])=><option key={k} value={k}>{v.n}</option>)}</select></label>;
const Bar=({parts,cols})=>{const t=parts.reduce((x,y)=>x+y,0)||1;return <div style={{display:'flex',height:14,borderRadius:7,overflow:'hidden',background:'var(--line)'}}>{parts.map((p,n)=><div key={n} style={{width:p*100/t+'%',background:cols[n]}}/>)}</div>};

function Registro({d,setD,gid,setGid,sid,setSid,date,setDate,ik,setIk}){
  const studs=d.students.filter(s=>s.groupId===gid);
  const idx=studs.findIndex(s=>s.id===sid);
  const inds=d.ind[ik];const T=INS[ik].t;
  const key=sid+'|'+date+'|'+ik;
  const [draft,setDraft]=useState({});
  const [msg,setMsg]=useState('');
  useEffect(()=>{setDraft(d.records[key]||{});setMsg(d.records[key]?'Ya hay una evaluación guardada para este día':'')},[sid,date,ik]);
  const setV=(i,v)=>{setMsg('');setDraft(x=>{const n={...x};if(v===undefined||(n[i]===v&&T!=='num'))delete n[i];else n[i]=v;return n})};
  const save=next=>{const c={};inds.forEach(i=>{const v=draft[i.id];if(v===undefined||v==='')return;if(T==='num'){const x=parseFloat(String(v).replace(',','.'));if(!isNaN(x))c[i.id]=x}else c[i.id]=v});
    setD(p=>({...p,records:{...p.records,[key]:c}}));setMsg('✔ Guardado');if(next&&idx<studs.length-1)setSid(studs[idx+1].id)};
  const done=inds.filter(i=>draft[i.id]!==undefined&&draft[i.id]!=='').length;
  if(!d.groups.length)return <div className="card">Primero crea un grupo y añade alumnado en la pestaña <b>Grupos</b>.</div>;
  return <div className="space-y-4">
    <div className="card grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <label className="block"><span className="mute text-sm">Grupo</span>
        <select className="inp" value={gid} onChange={e=>setGid(e.target.value)}>{d.groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></label>
      <label className="block"><span className="mute text-sm">Fecha</span>
        <input type="date" className="inp" value={date} onChange={e=>setDate(e.target.value)}/></label>
      <label className="block"><span className="mute text-sm">Alumno/a</span>
        <select className="inp" value={sid} onChange={e=>setSid(e.target.value)}>{studs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></label>
      <InsSel ik={ik} setIk={setIk}/>
    </div>
    {!studs.length?<div className="card">Este grupo aún no tiene alumnado. Impórtalo en <b>Grupos</b>.</div>:<>
    <div className="flex items-center justify-between gap-2">
      <button className="btn" disabled={idx<=0} onClick={()=>setSid(studs[idx-1].id)}>‹ Anterior</button>
      <div className="text-center"><div className="text-xl font-bold">{studs[idx]?.name}</div><div className="mute text-sm">Alumno {idx+1} de {studs.length} · {done}/{inds.length} indicadores</div></div>
      <button className="btn" disabled={idx>=studs.length-1} onClick={()=>setSid(studs[idx+1].id)}>Siguiente ›</button>
    </div>
    <div className="card space-y-3">
      {inds.map(i=><div key={i.id} className="flex flex-wrap items-center justify-between gap-3 pb-3" style={{borderBottom:'1px solid var(--line)'}}>
        <span className="font-bold flex-1" style={{minWidth:200}}>{i.text}</span>
        {T==='bin'&&<div className="flex gap-2">
          <button className={'sn yes'+(draft[i.id]===true?' on':'')} aria-pressed={draft[i.id]===true} onClick={()=>setV(i.id,true)}>SÍ</button>
          <button className={'sn no'+(draft[i.id]===false?' on':'')} aria-pressed={draft[i.id]===false} onClick={()=>setV(i.id,false)}>NO</button></div>}
        {T==='lvl'&&<div className="flex flex-wrap gap-2">{INS[ik].L.map((l,n)=><button key={n} className="sn" aria-pressed={draft[i.id]===n} style={{minWidth:72,padding:'.6rem .7rem',...(draft[i.id]===n?{background:COL[n],borderColor:COL[n],color:n===0?'#fff':'#111',boxShadow:'0 0 0 3px '+COL[n]+'66'}:{})}} onClick={()=>setV(i.id,n)}>{l}</button>)}</div>}
        {T==='num'&&<div className="flex items-center gap-2"><input type="number" step="any" inputMode="decimal" className="inp" style={{width:110}} aria-label={i.text} value={draft[i.id]??''} onChange={e=>setV(i.id,e.target.value===''?undefined:e.target.value)}/><span className="mute">{i.unit}</span></div>}
      </div>)}
      {!inds.length&&<p className="mute">No hay indicadores en este instrumento. Añádelos en la pestaña Indicadores.</p>}
      <div className="flex flex-wrap items-center gap-2 pt-1">
        <button className="btn btn-p" onClick={()=>save(false)}>Guardar evaluación</button>
        <button className="btn" disabled={idx>=studs.length-1} onClick={()=>save(true)}>Guardar y pasar al siguiente</button>
        <span className="mute" role="status">{msg}</span>
      </div>
    </div></>}
  </div>;
}

function Grupos({d,setD,gid,setGid}){
  const [name,setName]=useState('');const [txt,setTxt]=useState('');const [info,setInfo]=useState('');const [arm,setArm]=useState('');
  const studs=d.students.filter(s=>s.groupId===gid);
  const addG=()=>{const n=name.trim();if(!n)return;const g={id:uid(),name:n};setD(p=>({...p,groups:[...p.groups,g]}));setGid(g.id);setName('')};
  const delG=id=>{if(arm!==id){setArm(id);return}setArm('');const ids=d.students.filter(s=>s.groupId===id).map(s=>s.id);
    setD(p=>({...p,groups:p.groups.filter(g=>g.id!==id),students:p.students.filter(s=>s.groupId!==id),records:Object.fromEntries(Object.entries(p.records).filter(([k])=>!ids.includes(k.split('|')[0])))}));
    if(gid===id)setGid('')};
  const delS=id=>{if(arm!==id){setArm(id);return}setArm('');setD(p=>({...p,students:p.students.filter(s=>s.id!==id),records:Object.fromEntries(Object.entries(p.records).filter(([k])=>k.split('|')[0]!==id))}))};
  const imp=()=>{const have=new Set(studs.map(s=>s.name.toLowerCase()));
    const lines=txt.split(/\r?\n/).map(l=>l.replace(/^\s*(\d+\s*[.)\-]|[-•*])\s*/,'').trim()).filter(Boolean);
    const add=[];let dup=0;lines.forEach(l=>{if(have.has(l.toLowerCase())){dup++}else{have.add(l.toLowerCase());add.push({id:uid(),groupId:gid,name:l})}});
    setD(p=>({...p,students:[...p.students,...add]}));setTxt('');setInfo(add.length+' alumnos añadidos'+(dup?' ('+dup+' repetidos omitidos)':''))};
  return <div className="grid gap-4 md:grid-cols-2">
    <div className="card space-y-3">
      <h2 className="text-lg font-bold">Grupos</h2>
      <div className="flex gap-2"><input className="inp" placeholder="Ej.: 1º Primaria A" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addG()}/><button className="btn btn-p" onClick={addG}>Crear grupo</button></div>
      {d.groups.map(g=><div key={g.id} className="flex items-center justify-between gap-2">
        <button className="btn flex-1 text-left" style={g.id===gid?{borderColor:'var(--brand)',borderWidth:2}:{}} onClick={()=>setGid(g.id)}>{g.name} <span className="mute font-normal">({d.students.filter(s=>s.groupId===g.id).length})</span></button>
        <button className="btn btn-d" onClick={()=>delG(g.id)}>{arm===g.id?'¿Seguro?':'Borrar'}</button></div>)}
      {!d.groups.length&&<p className="mute">Aún no hay grupos. Crea el primero.</p>}
    </div>
    <div className="card space-y-3">
      <h2 className="text-lg font-bold">Importar alumnado {gid&&<span className="mute font-normal">en {d.groups.find(g=>g.id===gid)?.name}</span>}</h2>
      <textarea className="inp" rows="8" placeholder={'Pega aquí la lista, un alumno por línea:\nAna García López\nLucas Pérez Ruiz'} value={txt} onChange={e=>setTxt(e.target.value)}/>
      <div className="flex items-center gap-3"><button className="btn btn-p" disabled={!gid||!txt.trim()} onClick={imp}>Importar al grupo</button><span className="mute" role="status">{gid?info:'Selecciona o crea un grupo'}</span></div>
      <div style={{maxHeight:240,overflowY:'auto'}} className="space-y-1">
        {studs.map(s=><div key={s.id} className="flex items-center justify-between"><span>{s.name}</span><button className="btn btn-d" style={{padding:'.15rem .6rem'}} onClick={()=>delS(s.id)}>{arm===s.id?'¿Seguro?':'✕'}</button></div>)}
      </div>
    </div>
  </div>;
}

function Indicadores({d,setD,ik,setIk}){
  const [n,setN]=useState('');const [u,setU]=useState('');const [arm,setArm]=useState('');
  const num=INS[ik].t==='num';
  const set=f=>setD(p=>({...p,ind:{...p.ind,[ik]:f(p.ind[ik])}}));
  const upd=(id,patch)=>set(a=>a.map(i=>i.id===id?{...i,...patch}:i));
  const del=id=>{if(arm!==id){setArm(id);return}setArm('');set(a=>a.filter(i=>i.id!==id))};
  const add=()=>{const t=n.trim();if(!t)return;set(a=>[...a,{id:uid(),text:t,...(num?{unit:u.trim()}:{})}]);setN('');setU('')};
  return <div className="card space-y-3 max-w-3xl">
    <h2 className="text-lg font-bold">Indicadores de evaluación</h2>
    <InsSel ik={ik} setIk={setIk}/>
    {INS[ik].t==='lvl'&&<p className="mute text-sm">Niveles: {INS[ik].L.join(' · ')}</p>}
    <p className="mute text-sm">Edita el enunciado directamente. Los cambios se guardan al escribir.</p>
    {d.ind[ik].map(i=><div key={i.id} className="flex gap-2"><input className="inp" aria-label="Enunciado del indicador" value={i.text} onChange={e=>upd(i.id,{text:e.target.value})}/>
      {num&&<input className="inp" style={{width:90}} aria-label="Unidad" placeholder="Unidad" value={i.unit||''} onChange={e=>upd(i.id,{unit:e.target.value})}/>}
      <button className="btn btn-d" onClick={()=>del(i.id)}>{arm===i.id?'¿Seguro?':'Eliminar'}</button></div>)}
    <div className="flex gap-2"><input className="inp" placeholder="Nuevo indicador" value={n} onChange={e=>setN(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/>
      {num&&<input className="inp" style={{width:90}} placeholder="Unidad" value={u} onChange={e=>setU(e.target.value)}/>}
      <button className="btn btn-p" onClick={add}>Añadir</button></div>
  </div>;
}

function Resumen({d,gid,setGid,sid,setSid,ik,setIk}){
  const [a,setA]=useState('');const [b,setB]=useState('');const [msg,setMsg]=useState('');const [gm,setGm]=useState('');
  const studs=d.students.filter(s=>s.groupId===gid);
  const T=INS[ik].t;const inds=d.ind[ik];
  const rows=useMemo(()=>rec(d,sid,ik,a,b),[d.records,sid,ik,a,b]);
  const stat=ids=>{const x=rows.flatMap(r=>ids.filter(i=>r[3][i]!==undefined).map(i=>r[3][i]));const t=x.length;
    if(T==='bin'){const y=x.filter(v=>v===true).length;return{y,n:t-y,t,p:t?Math.round(y*100/t):0}}
    if(T==='lvl'){const avg=t?x.reduce((s,v)=>s+v+1,0)/t:0;return{t,avg,p:Math.round(avg*25),cnt:INS[ik].L.map((_,n)=>x.filter(v=>v===n).length)}}
    return t?{t,first:x[0],last:x[t-1],min:Math.min(...x),max:Math.max(...x),avg:x.reduce((s,v)=>s+v,0)/t}:{t};};
  const all=stat(inds.map(i=>i.id));
  const f1=v=>String(Math.round(v*10)/10).replace('.',',');
  const H={bin:['Indicador','SÍ','NO','% SÍ'],lvl:['Indicador','Media (1-4)',...INS[ik].L],num:['Indicador','Primera','Última','Mín','Máx','Media']};
  const R=i=>{const s=stat([i.id]);return T==='bin'?[s.y,s.n,s.p+'%']:T==='lvl'?[s.t?f1(s.avg):'–',...s.cnt]:s.t?[s.first,s.last,s.min,s.max,f1(s.avg)].map(v=>String(v).replace('.',',')):['–','–','–','–','–']};
  const cards=T==='bin'?[['Total SÍ',all.y,'#16A34A'],['Total NO',all.n,'#E5252A'],['Cumplimiento',all.p+'%'],['Días evaluados',rows.length]]:T==='lvl'?[['Nivel medio (1-4)',f1(all.avg)],['Logro medio',all.p+'%'],['Observaciones',all.t],['Días evaluados',rows.length]]:[['Mediciones',all.t],['Días evaluados',rows.length]];
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sname=d.students.find(x=>x.id===sid)?.name||'';
  const gname=d.groups.find(x=>x.id===gid)?.name||'';
  const lab=i=>i.text+(i.unit?' ('+i.unit+')':'');
  const reportHtml=()=>{
    const per=(a||b)?(a?fmt(a):'inicio')+' a '+(b?fmt(b):'hoy'):'Todo el historial';
    const th='border:1px solid #999;padding:4px 6px;background:#E8EEF7;text-align:center;font-size:10pt';
    const td='border:1px solid #999;padding:4px 6px;text-align:center;font-size:10pt';
    const row=(c,h)=>'<tr>'+c.map((x,n)=>`<td style="${h?th:td}${n===0&&!h?';text-align:left':''}">${esc(x)}</td>`).join('')+'</tr>';
    const tb=(h,r)=>'<table style="border-collapse:collapse">'+row(h,1)+r.map(c=>row(c)).join('')+'</table>';
    return `<h1>CEIP Cervantes - Informe de Educación Física</h1><p><b>Alumno/a:</b> ${esc(sname)}<br><b>Grupo:</b> ${esc(gname)}<br><b>Instrumento:</b> ${esc(INS[ik].n)}<br><b>Periodo:</b> ${per}<br><b>Generado:</b> ${fmt(today())}</p>`
    +`<p><b>Resumen:</b> ${esc(cards.map(c=>c[0]+': '+c[1]).join(' · '))}</p><h2>Por indicador</h2>`+tb(H[T],inds.map(i=>[lab(i),...R(i)]))
    +`<h2>Historial por fecha</h2>`+tb(['Indicador',...rows.map(r=>fmt(r[1]))],inds.map(i=>[lab(i),...rows.map(r=>r[3][i.id]===undefined?'–':vtxt(ik,r[3][i.id]))]))
    +`<p style="font-size:9pt;color:#777">Autor: Miguel Ángel González Lozano</p>`;
  };
  const copyDoc=async()=>{
    const html=reportHtml();let ok=false;
    try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html.replace(/<[^>]+>/g,' ')],{type:'text/plain'})})]);ok=true}catch(e){
      try{const el=document.createElement('div');el.contentEditable='true';el.innerHTML=html;el.style.cssText='position:fixed;left:-9999px';document.body.appendChild(el);const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand('copy');s.removeAllRanges();el.remove()}catch(e2){}}
    setMsg(ok?'Copiado. En el documento de Google que se abre, pulsa Ctrl+V (⌘+V).':'No se pudo copiar. Usa "Descargar informe".');
    if(ok)window.open('https://docs.new','_blank','noopener');
  };
  const dlDoc=async()=>{
    const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Informe</title></head><body style="font-family:Arial,sans-serif">'+reportHtml()+'</body></html>';
    const r=await saveFile('Informe_EF_'+sname.replace(/[^\wÁ-ú]+/g,'_')+'_'+today()+'.html',html,'text/html;charset=utf-8');
    setMsg(r==='ok'?'Archivo descargado. Súbelo a Google Drive y ábrelo con Google Docs.':'Descarga cancelada.');
  };
  const dlGroup=async()=>{
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const lines=[['Grupo','Alumno','Fecha','Instrumento','Indicador','Valor','Unidad'].map(q).join(';')];let n=0;
    studs.forEach(s=>rec(d,s.id,'',a,b).forEach(([,dt,k,r])=>(d.ind[k]||[]).forEach(i=>{if(r[i.id]===undefined)return;n++;lines.push([gname,s.name,dt,INS[k].n,i.text,vtxt(k,r[i.id]),i.unit||''].map(q).join(';'))})));
    if(!n){setGm('No hay registros de este grupo en el periodo elegido.');return}
    const r=await saveFile('Registros_EF_'+gname.replace(/[^\wÁ-ú]+/g,'_')+'_'+today()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');
    setGm(r==='ok'?'Descargados '+n+' registros de '+studs.length+' alumnos (todos los instrumentos). Se abre con Excel o Google Sheets.':'Descarga cancelada.');
  };
  if(!d.groups.length)return <div className="card">Crea un grupo y registra evaluaciones para ver resúmenes.</div>;
  return <div className="space-y-4">
    <div className="card grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <label className="block"><span className="mute text-sm">Grupo</span><select className="inp" value={gid} onChange={e=>setGid(e.target.value)}>{d.groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></label>
      <label className="block"><span className="mute text-sm">Alumno/a</span><select className="inp" value={sid} onChange={e=>setSid(e.target.value)}>{studs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></label>
      <InsSel ik={ik} setIk={setIk}/>
      <label className="block"><span className="mute text-sm">Fecha inicio</span><input type="date" className="inp" value={a} onChange={e=>setA(e.target.value)}/></label>
      <label className="block"><span className="mute text-sm">Fecha fin</span><input type="date" className="inp" value={b} onChange={e=>setB(e.target.value)}/></label>
    </div>
    <div className="card flex flex-wrap items-center gap-2"><b>Datos de todo el grupo:</b><button className="btn btn-p" disabled={!studs.length} onClick={dlGroup}>Descargar registros del grupo (CSV)</button><span className="mute text-sm" role="status">{gm||'Incluye todos los instrumentos y respeta el rango de fechas (vacío = todo).'}</span></div>
    {!sid?<div className="card">Selecciona un alumno.</div>:!rows.length?<div className="card">No hay evaluaciones de este instrumento en el periodo elegido.</div>:<>
    <div className="card flex flex-wrap items-center gap-2"><b>Exportar a Google Docs:</b><button className="btn btn-p" onClick={copyDoc}>Copiar y abrir Google Docs</button><button className="btn" onClick={dlDoc}>Descargar informe (.html)</button><span className="mute text-sm" role="status">{msg}</span></div>
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">{cards.map(c=><div key={c[0]} className="card"><div className="mute text-sm">{c[0]}</div><div className="text-3xl font-bold" style={c[2]?{color:c[2]}:{}}>{c[1]}</div></div>)}</div>
    <div className="card space-y-3">
      {T!=='num'&&<Bar parts={T==='bin'?[all.y,all.n]:all.cnt} cols={T==='bin'?['#16A34A','#E5252A']:COL}/>}
      {T==='lvl'&&<div className="flex flex-wrap gap-3 text-sm">{INS[ik].L.map((l,n)=><span key={n}><span style={{display:'inline-block',width:10,height:10,background:COL[n],borderRadius:2}}/> {l} ({all.cnt[n]})</span>)}</div>}
      <h3 className="font-bold">Por indicador</h3>
      <div style={{overflowX:'auto'}}><table><thead><tr>{H[T].map((h,n)=><th key={n} className={n===0?'f':''}>{h}</th>)}</tr></thead>
      <tbody>{inds.map(i=><tr key={i.id}><td className="f">{lab(i)}</td>{R(i).map((x,n)=><td key={n}>{x}</td>)}</tr>)}</tbody></table></div>
    </div>
    <div className="card"><h3 className="font-bold mb-2">Historial por fecha</h3>
      <div style={{overflowX:'auto'}}><table><thead><tr><th className="f">Indicador</th>{rows.map(r=><th key={r[1]}>{fmt(r[1])}</th>)}</tr></thead>
      <tbody>{inds.map(i=><tr key={i.id}><td className="f">{lab(i)}</td>{rows.map(r=>{const v=r[3][i.id];return <td key={r[1]} style={{fontWeight:700,...(T==='bin'?{color:v===true?'#16A34A':v===false?'#E5252A':'var(--mute)'}:T==='lvl'&&v!==undefined?{background:COL[v]+'66'}:{})}}>{v===undefined?'–':vtxt(ik,v)}</td>})}</tr>)}</tbody></table></div>
    </div></>}
  </div>;
}

function App(){
  const [d,setD]=useState(load);
  const [tab,setTab]=useState('reg');
  const [gid,setGid]=useState('');const [sid,setSid]=useState('');const [date,setDate]=useState(today());const [ik,setIk]=useState('cotejo');
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}},[d]);
  useEffect(()=>{if(!d.groups.find(g=>g.id===gid))setGid(d.groups[0]?.id||'')},[d.groups,gid]);
  useEffect(()=>{const s=d.students.filter(x=>x.groupId===gid);if(!s.find(x=>x.id===sid))setSid(s[0]?.id||'')},[d.students,gid,sid]);
  const tabs=[['reg','Registro diario'],['grp','Grupos'],['ind','Indicadores'],['res','Resumen por alumno']];
  const sel={gid,setGid,sid,setSid,ik,setIk};
  return <div style={{paddingBottom:70}}>
    <header style={{background:'var(--card)',borderBottom:'1px solid var(--line)'}}>
      <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <h1 className="text-xl sm:text-2xl font-bold" style={{color:'var(--brand)'}}>CEIP Cervantes - Educación Física: Instrumentos de Evaluación</h1>
        <Logo src={d.logo} onFile={l=>setD(p=>({...p,logo:l}))}/>
      </div>
    </header>
    <main className="max-w-5xl mx-auto px-4 py-4 space-y-4">
      <nav role="tablist" className="flex flex-wrap gap-1 card" style={{padding:'.35rem'}}>{tabs.map(([k,l])=><button key={k} role="tab" className="tab" aria-selected={tab===k} onClick={()=>setTab(k)}>{l}</button>)}</nav>
      {tab==='reg'&&<Registro d={d} setD={setD} {...sel} date={date} setDate={setDate}/>}
      {tab==='grp'&&<Grupos d={d} setD={setD} gid={gid} setGid={setGid}/>}
      {tab==='ind'&&<Indicadores d={d} setD={setD} ik={ik} setIk={setIk}/>}
      {tab==='res'&&<Resumen d={d} {...sel}/>}
    </main>
    <footer className="mute text-sm text-center" style={{position:'fixed',left:0,right:0,bottom:0,background:'var(--card)',borderTop:'1px solid var(--line)',padding:'.5rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px))'}}>Autor: Miguel Ángel González Lozano</footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
